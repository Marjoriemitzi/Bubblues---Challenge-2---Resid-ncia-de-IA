services:
  db:
    build: ./db
    container_name: bubbles-db
    environment:
      POSTGRES_DB: ${DB_NAME:-pipeline_brasilia}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD no arquivo .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/20_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  dados_postgres:
